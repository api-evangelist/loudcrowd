aid: loudcrowd
name: LoudCrowd
description: >-
  LoudCrowd is a creator-commerce platform for consumer brands, combining an influencer/ambassador
  and affiliate marketing platform, on-domain Creator Storefronts, a ShopWith AI shopping concierge
  for product detail pages, AI Influencer Agents for discovery, outreach and moderation, and Creator
  GEO for turning earned creator content into AI-recommendable assets. For developers it publishes a
  small, purpose-built OpenAPI 3.0 surface across three services: a read-only account-scoped Brand API
  for pulling program-attributed orders, an HMAC-SHA256-signed Attribution Events API for pushing order
  create/update/cancel and refund events plus product-catalog batches from custom and headless commerce
  stacks, and a Creator Storefronts data API used in place of the hosted storefront web components.
  A browser SDK loaded from pub.loudcrowd.com renders storefront and influencer-list app blocks and
  performs first-party affiliate attribution on Shopify, Salesforce Commerce Cloud and custom sites.
