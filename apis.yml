apis:
- name: LoudCrowd Brand API
  description: >-
    Read-only, account-scoped REST API for pulling orders attributed to members of a LoudCrowd program.
    Each result identifies the program member and includes attribution methods, financial values and
    platform timestamps, cursor-paginated with the most recently received orders first. Authenticated
    with an account API token sent in the X-LC-Account-Key header and requires the Read orders and
    Read programs scopes.
  humanURL: https://docs.loudcrowd.com/reference/list_program_orders
  baseURL: https://api.loudcrowd.com
  tags:
  - Creator Marketing
  - Affiliate Marketing
  - Attribution
  - Ecommerce
  properties:
  - type: OpenAPI
    url: openapi/loudcrowd-openapi.yml
  - type: Documentation
    url: https://docs.loudcrowd.com/reference/list_program_orders
- name: LoudCrowd Attribution Events API
  description: >-
    Single-endpoint event intake for custom and headless commerce stacks. POST /event/ecomm accepts the
    complete order payload for ORDER_CREATE, ORDER_UPDATE and ORDER_CANCEL topics selected by the
    X-LC-TOPIC header, including refund line items for return-driven commission adjustment, and
    POST /product-data batch-upserts or deletes product catalog records. Requests are authenticated
    with a lowercase hex HMAC-SHA256 signature of the exact raw request body in X-Signature, keyed on
    an API token carrying the Write orders scope, alongside the integration's X-LC-SHOP-ID.
  humanURL: https://docs.loudcrowd.com/reference/submit_order_event
  baseURL: https://api.loudcrowd.com
  tags:
  - Attribution
  - Ecommerce
  - Commissions
  - Webhooks
  properties:
  - type: OpenAPI
    url: openapi/loudcrowd-openapi.yml
  - type: Documentation
    url: https://docs.loudcrowd.com/reference/submit_order_event
- name: LoudCrowd Creator Storefronts API
  description: >-
    Data API to be used in place of the hosted creator storefront web components, leaving the caller
    responsible for rendering. Five read operations return ambassador information, an ambassador's
    collections, paginated collection feed items mixing shoppable media and picked products, media
    detail for a shoppable post, and product-variant detail for an ambassador's picked product.
    Bearer-token authenticated.
  humanURL: https://docs.loudcrowd.com/docs/install-the-loudcrowd-storefront-page-in-your-custom-website
  baseURL: https://store-api.loudcrowd.com/api
  tags:
  - Creator Commerce
  - Social Commerce
  - Ecommerce
  properties:
  - type: OpenAPI
    url: openapi/loudcrowd-creator-storefronts-openapi.yml
  - type: Documentation
    url: https://docs.loudcrowd.com/docs/install-the-loudcrowd-storefront-page-in-your-custom-website
