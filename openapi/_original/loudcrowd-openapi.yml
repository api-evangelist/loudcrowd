  /StorefrontProductDetails:
    get:
      summary: Retrieve Product Details
      description: Detailed data to support social-enhanced display of an ambassador's picked product.
      parameters:
      - in: query
        name: lcAmbassadorId
        description: The unique identifier of the ambassador generated by the LoudCrowd platform.
        required: true
        schema:
          type: string
          maxLength: 32
          pattern: ^[a-zA-Z0-9+/]*={0,2}$
      - in: query
        name: shopId
        description: The unique identifier of the shop that the ambassador is associated with. This field
          is not required if the `shopifyId` field is populated.
        required: false
        schema:
          type: string
      - in: query
        name: shopifyId
        description: The unique identifier of the shopify shop that the ambassador is associated with.
          This field is not required if the `shopId` field is populated.
        required: false
        schema:
          type: string
      - in: query
        name: productVariantId
        description: The unique identifier of the product variant item in the LoudCrowd platform.
        required: true
        schema:
          type: string
          maxLength: 32
          pattern: ^[a-zA-Z0-9+/]*={0,2}$
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  productDetails:
                    type: object
                    properties:
                      product:
                        type: object
                        properties:
                          id:
                            type: string
                            description: The unique identifier of the product in LoudCrowd.
                            example: XYZDJSK1ABC
                          active:
                            type: boolean
                            description: Whether the product is active.
                            example: true
                          brand:
                            type: string
                            nullable: true
                            description: The brand of the product.
                            example: Nike
                          handle:
                            type: string
                            nullable: true
                            description: The handle of the product.
                            example: nike-air-force-1
                          imageSrc:
                            type: string
                            nullable: true
                            description: The URL of the product image.
                            example: https://media.loudcrowd.com/17841409007688784.jpg
                          options:
                            description: The options available for the product.
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  description: The name of the option.
                                  type: string
                                values:
                                  description: The possible values of the option.
                                  type: array
                                  items:
                                    type: string
                          platformProductId:
                            type: string
                            description: The unique identifier of the product in the platform.
                            example: XYZDJSK1ABC
                          priceCurrencyCode:
                            $ref: '#/components/schemas/priceCurrencyCode'
                          prices:
                            $ref: '#/components/schemas/productPrices'
                          productUrl:
                            description: The URL of the product details.
                            type: string
                            nullable: true
                          title:
                            description: The title of the product.
                            type: string
                            nullable: true
                      productVariant:
                        type: object
                        properties:
                          id:
                            description: The unique identifier of the product variant in the LoudCrowd.
                            type: string
                            example: XYZDJSK1ABC
                          productUrl:
                            description: The URL of the variant the ambassador has picked.
                            type: string
                            nullable: true
                          selectedOptions:
                            description: The selected options of the product variant.
                            type: array
                            items:
                              $ref: '#/components/schemas/selectedOptionItem'
                      customMedia:
                        description: If the ambassador chose a custom media for the feed item when they
                          picked it, this object will be populated with that media.
                        type: object
                        properties:
                          id:
                            description: The unique identifier of the custom media in the LoudCrowd platform.
                            type: string
                            example: XYZ123ABC
                          imageSrc:
                            description: The URL of the custom media image.
                            type: string
                            nullable: true
                            example: https://media.loudcrowd.com/17841409007688784.jpg
                        nullable: true
                      taggedMedias:
                        type: array
                        items:
                          type: object
                          $ref: '#/components/schemas/mediaItem'
                        maxItems: 250
                        nullable: true
                      featuredAt:
                        description: If the product is featured, the date it was featured in Coordinated
                          Universal Time (UTC).
                        type: string
                        nullable: true
                        example: '2021-07-01T00:00:00Z'
                      pickedAt:
                        description: The date it was picked and added to the collection in Coordinated
                          Universal Time (UTC).
                        type: string
                        nullable: true
                        example: '2021-07-01T00:00:00Z'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
  /event/ecomm:
    post:
      summary: Submit Order Event
      description: Submit order create, update, and cancel event payloads to LoudCrowd for attribution
        and commission calculation.
      operationId: submit_order_event
      tags:
      - Attribution Events API
      servers:
      - url: https://api.loudcrowd.com
      security: []
      parameters:
      - in: header
        name: X-LC-SHOP-ID
        description: The Shop ID of the ecommerce integration that owns the order, shown on the LoudCrowd
          Integrations page. This is not an Account ID or API token.
        required: true
        schema:
          type: string
      - in: header
        name: X-Signature
        description: Lowercase hexadecimal HMAC-SHA256 of the exact raw request-body bytes, keyed with
          an API token that grants the **Write orders** scope. Do not include a sha256= prefix.
        required: true
        schema:
          type: string
      - in: header
        name: X-LC-TOPIC
        description: Specifies the event type. ORDER_CANCEL requires the complete order payload, a non-null
          platform_cancelled_at, and a platform_updated_at later than the preceding event.
        required: true
        schema:
          type: string
          enum:
          - ORDER_CREATE
          - ORDER_UPDATE
          - ORDER_CANCEL
      - in: header
        name: Content-Type
        description: Content type of the request
        required: true
        schema:
          type: string
          default: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - platform_order_id
              - platform_ordered_at
              - amount
              - tax
              - shipping
              - currency_code
              - line_items
              properties:
                platform_order_id:
                  type: string
                  description: Your internal identifier for the order
                platform_customer_id:
                  type: string
                  description: Your internal identifier for the customer who placed the order
                email:
                  type: string
                  format: email
                  description: Customer's email address, when available.
                phone:
                  type: string
                  description: Customer's phone number, when available.
                platform_ordered_at:
                  type: string
                  format: date-time
                  description: The date and time when the order was placed, in ISO 8601 format (UTC)
                platform_updated_at:
                  type: string
                  format: date-time
                  description: The date and time when the order was last updated, in ISO 8601 format (UTC).
                    For ORDER_CANCEL, send a value later than the preceding event.
                platform_cancelled_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: The date and time when the order was cancelled, in ISO 8601 format (UTC).
                    This must be non-null for ORDER_CANCEL; set it to null when the order is not cancelled.
                amount:
                  type: string
                  description: Total amount of the order as a decimal string, including tax, shipping,
                    and discounts. Excludes refunds/returns.
                  example: '200.00'
                tax:
                  type: string
                  description: Total tax amount for the order as a decimal string
                  example: '12.00'
                shipping:
                  type: string
                  description: Total shipping cost for the order as a decimal string
                  example: '10.00'
                currency_code:
                  type: string
                  description: Currency code of the order, in ISO 4217 format
                discounts:
                  type: array
                  description: Array of discount objects applied to the order
                  items:
                    type: object
                    properties:
                      code:
                        type: string
                        description: Discount code used
                      type:
                        type: string
                        enum:
                        - DISCOUNT_CODE
                        description: Type of discount application
                      value_type:
                        type: string
                        enum:
                        - FIXED_AMOUNT
                        - PERCENTAGE
                        description: Type of discount value
                      value:
                        type: string
                        description: Value of the discount as a decimal string
                        example: '15'
                    required:
                    - code
                    - type
                    - value_type
                    - value
                line_items:
                  type: array
                  minItems: 1
                  description: Array of line item objects representing products purchased in the order
                  items:
                    type: object
                    required:
                    - line_item_id
                    - sku
                    - amount
                    - tax
                    - quantity
                    properties:
                      line_item_id:
                        type: string
                        description: Platform-specific identifier for the line item
                      sku:
                        type: string
                        description: SKU of the product purchased
                      variant_sku:
                        type: string
                        description: SKU of the product variant purchased
                      amount:
                        type: string
                        description: Total amount paid for the line item as a decimal string, including
                          taxes and deductions
                        example: '100.00'
                      tax:
                        type: string
                        description: Total tax amount for the line item as a decimal string
                        example: '6.00'
                      quantity:
                        type: string
                        description: Number of units purchased for this line item as a numeric string
                        example: '2'
                refund_line_items:
                  type: array
                  description: Array of refund line item objects representing returned or refunded products
                  items:
                    type: object
                    required:
                    - refund_line_item_id
                    - line_item_id
                    - platform_refunded_at
                    - sku
                    - amount
                    - tax
                    - quantity
                    properties:
                      refund_line_item_id:
                        type: string
                        description: Identifier unique within the ecommerce integration and stable for
                          this original line_item_id. Reuse it with cumulative current values on later
                          updates, and use a different ID for a different original line_item_id.
                      line_item_id:
                        type: string
                        description: Identifier of the original line item that was refunded
                      platform_refunded_at:
                        type: string
                        format: date-time
                        description: Date and time when the line item was refunded, in ISO 8601 format
                          (UTC)
                      sku:
                        type: string
                        description: SKU of the product refunded
                      variant_sku:
                        type: string
                        description: SKU of the product variant refunded
                      amount:
                        type: string
                        description: Total cumulative amount refunded for the line item as a decimal string,
                          including tax refunds
                        example: '100.00'
                      tax:
                        type: string
                        description: Total cumulative tax refunded for the line item as a decimal string
                        example: '6.00'
                      quantity:
                        type: string
                        description: Total cumulative number of units refunded for this line item as a
                          numeric string
                        example: '1'
                lc_anon_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: Value of lc_anon_user_id from browser local storage. This is optional if
                    LoudCrowd's order confirmation script is installed.
      responses:
        '200':
          description: The event was authenticated and accepted for asynchronous processing. This response
            does not confirm persistence, attribution, or commission calculation.
          content:
            text/html:
              schema:
                type: string
                enum:
                - success
              example: success
        '400':
          description: Bad request - Invalid data provided
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid request data
        '401':
          description: Authentication failed. The response body is empty.
        '500':
          description: Internal processing failed. The response body is empty.
  /product-data:
    post:
      summary: Send Product Data
      description: Batch upsert or delete product catalog records in LoudCrowd. Aligns with the supported
        file formats documented in the LoudCrowd developer docs. This API is designed to mirror the ingestion
        pipeline currently used for file-based product loads so that existing mappings can be reused.
      operationId: send_product_data
      parameters:
      - in: header
        name: X-LC-SHOP-ID
        description: Your LoudCrowd internal shop identifier
        required: true
        schema:
          type: string
      - in: header
        name: X-Signature
        description: The SHA-256 hexadecimal digest of the UTF-8 encoded JSON payload
        required: true
        schema:
          type: string
      - in: header
        name: X-LC-TOPIC
        description: Specifies the operation to apply to the provided products
        required: true
        schema:
          type: string
          enum:
          - PRODUCT_UPSERT
          - PRODUCT_DELETE
      - in: header
        name: Content-Type
        description: Content type of the request
        required: true
        schema:
          type: string
          default: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/sendProductDataRequest'
      responses:
        '200':
          description: Request accepted and processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Product data processed
                  processedCount:
                    type: integer
                    example: 123
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /api/v1/brand/{account_id}/programs/{program_id}/orders:
    get:
      summary: List program orders
      description: Retrieves orders attributed to members of a LoudCrowd program. Each result identifies
        the program member and includes attribution methods, financial values, and platform timestamps.
        Orders are returned in the order LoudCrowd received them, with the most recent first. Requires
        the **Read orders** and **Read programs** scopes.
      operationId: list_program_orders
      tags:
      - Brand API
      servers:
      - url: https://api.loudcrowd.com
      security:
      - accountKeyAuth: []
      parameters:
      - in: path
        name: account_id
        description: Your Account ID, shown under API identifiers in the LoudCrowd app.
        required: true
        example: YOUR_ACCOUNT_ID
        schema:
          type: string
      - in: path
        name: program_id
        description: Your Program ID, shown under API identifiers in the LoudCrowd app.
        required: true
        example: YOUR_PROGRAM_ID
        schema:
          type: string
      - in: query
        name: limit
        description: Maximum number of orders to return.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - in: query
        name: cursor
        description: Opaque next-page cursor returned by the preceding response.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: A page of program orders.
          headers:
            Link:
              description: Next-page URL with rel="next". Absent on the final page.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - nextCursor
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/brandOrder'
                  nextCursor:
                    type: string
                    nullable: true
                    description: Opaque cursor for the next page, or null on the final page.
              example:
                data:
                - orderId: ORDER-123
                  ambassadorLcId: Y3VzdG9tZXI6MTIz
                  attributionTypes:
                  - LANDED
                  commissionAmount: '10.00'
                  amount: '100.00'
                  tax: '8.00'
                  shipping: '5.00'
                  refundAmount: '0.00'
                  refundTax: '0.00'
                  currency: USD
                  cancelledAt: null
                  orderedAt: '2026-06-01T12:00:00Z'
                  lastUpdatedAt: '2026-06-02T08:30:00Z'
                nextCursor: null
        '400':
          description: The limit or cursor is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/brandBadRequest'
              example:
                error: Bad Request
                message: invalid cursor
        '401':
          description: The API token is missing or invalid, lacks a required scope, or cannot access the
            requested account or program.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/brandUnauthorized'
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/brandInternalError'
security:
- bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Authorization header using the Bearer scheme. Example: "Authorization: Bearer {token}"'
    accountKeyAuth:
      type: apiKey
      in: header
      name: X-LC-Account-Key
      description: API token created in LoudCrowd.
      x-default: YOUR_API_TOKEN
  responses:
    '400':
      description: Request is missing or has a bad parameter.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 400
              message:
                type: string
                example: Bad Request
    '401':
      description: Key is valid, but the account does not have permissions to perform this action.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 401
              message:
                type: string
                example: Not Authorized
    '403':
      description: Request is missing or has an invalid API key.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 403
              message:
                type: string
                example: Forbidden
    '404':
      description: The requested resource doesn't exist.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 404
              message:
                type: string
                example: Not Found
    '422':
      description: Validation failed for one or more product records.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 422
              message:
                type: string
                example: Unprocessable Entity
              recordErrors:
                type: array
                description: Per-record validation errors
                items:
                  type: object
                  properties:
                    index:
                      type: integer
                      description: Zero-based index of the product in the payload
                      example: 0
                    field:
                      type: string
                      description: JSON pointer or field path
                      example: products[0].platform_product_id
                    code:
                      type: string
                      description: Machine-readable error code
                      example: REQUIRED
                    message:
                      type: string
                      description: Human readable error
                      example: platform_product_id is required
                  required:
                  - index
                  - code
                  - message
    '429':
      description: You hit the rate limit for this account. All endpoints share the same rate limit for
        an account.
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Total requests allowed in the current window
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Requests remaining in the current window
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Unix epoch seconds when the current window resets
        Retry-After:
          schema:
            type: integer
          description: Seconds until the next request may be made
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 429
              message:
                type: string
                example: Rate Limit Exceeded
    '500':
      description: Something is wrong on LoudCrowd's end.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 500
              message:
                type: string
                example: Server Error
    '503':
      description: Service unavailable.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 503
              message:
                type: string
                example: Bad Gateway
  schemas:
    priceCurrencyCode:
      enum:
      - USD
      - CAD
      - GBP
      - AUD
      - AED
      - AFN
