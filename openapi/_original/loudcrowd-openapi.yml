                            type: string
                            nullable: true
                          hideSalesPrice:
                            description: Whether to hide the sales price on the storefront.
                            example: false
                            type: boolean
                            nullable: true
                          name:
                            description: The name of the program that the ambassador joined.
                            example: Our Brand's Ambassadors
                            type: string
                          showOutOfStockProducts:
                            description: Whether to show out of stock products on the storefront.
                            example: false
                            type: boolean
                            nullable: true
                        type: object
                      socialUsers:
                        type: array
                        description: The social media accounts that the ambassador has connected to their
                          storefront.
                        items:
                          properties:
                            platform:
                              type: string
                              description: The platform of the social media account.
                              example: INSTAGRAM
                              nullable: true
