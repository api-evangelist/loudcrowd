                                  example: https://media.loudcrowd.com/18057689623487832.mp4
                                  nullable: true
                              type: object
                            type: array
                            maxItems: 100
                            nullable: true
                          mediaType:
                            enum:
                            - IMAGE
                            - VIDEO
                            - CAROUSEL_ALBUM
                            type: string
                            nullable: true
                            description: The media type of the item.
                            example: VIDEO
