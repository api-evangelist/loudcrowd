info:
  title: LoudCrowd API
  version: 0.0.0
  description: |
    LoudCrowd public API definitions, including the account-scoped Brand API and Attribution Events API.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
openapi: 3.0.0
servers:
- url: https://store-api.loudcrowd.com/api
  description: LoudCrowd Creator Storefronts API
- url: https://api.loudcrowd.com
  description: LoudCrowd Attribution Events API
x-readme:
  explorer-enabled: false
paths:
  /StorefrontAmbassador:
    get:
      summary: Retrieve Ambassador Information
      description: Returns information about the target ambassador identified by their unique LoudCrowd
        ID.
      parameters:
      - in: query
        name: lcAmbassadorId
        description: The unique identifier of the ambassador generated by the LoudCrowd platform.
        required: true
        schema:
          type: string
          maxLength: 32
          pattern: ^[a-zA-Z0-9+/]*={0,2}$
      - in: query
        name: shopId
        description: The unique identifier of the shop that the ambassador is associated with. This field
          is not required if the `shopifyId` field is populated.
        required: false
        schema:
          type: string
          maxLength: 32
          pattern: ^[a-zA-Z0-9+/]*={0,2}$
      - in: query
        name: shopifyId
        description: The unique identifier of the shopify shop that the ambassador is associated with.
          This field is not required if the `shopId` field is populated.
        required: false
        schema:
          type: string
          maxLength: 32
          pattern: ^[a-zA-Z0-9+/]*={0,2}$
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  ecommAmbassador:
                    properties:
                      affiliateCode:
                        description: This is the ambassador's affiliate code, if one has been assigned
                          to them.
                        type: string
                        nullable: true
                        example: JOE123
                      ambassadorLink:
                        type: string
                        nullable: true
                        description: The sharable link to the ambassador's storefront.
                        example: https://store.com/creator_storefront?lc_ambassador_id=XYZ123ABC
                      firstName:
                        type: string
                        nullable: true
                        description: The first name of the ambassador.
                        example: Joe
                      id:
                        type: string
                        description: The unique identifier of the ambassador in the LoudCrowd platform.
                        example: XYZ123ABC
                      lastName:
                        type: string
                        nullable: true
                        description: The last name of the ambassador.
                        example: Smith
                      linkDiscountEnabled:
                        type: boolean
                        description: If `true` the ambassador's storefront has an automatic discount applied.
                        example: false
                        nullable: true
                      profile:
                        properties:
                          avatar:
                            type: string
                            nullable: true
                            description: The URL of the ambassador's avatar image.
                            example: https://media.loudcrowd.com/17841409007688784.jpg
                          bio:
                            type: string
                            nullable: true
                            description: The biography that the ambassador has chosen to display at the
                              top of their storefront.
                            example: Welcome to my store! I hope you find something you love.
                        type: object
                        nullable: true
                      program:
                        properties:
                          codeDiscount:
                            properties:
                              appliesOnEachItem:
                                type: boolean
                                nullable: true
                              collections:
                                items:
                                  properties:
                                    id:
                                      type: string
                                    title:
                                      type: string
                                  type: object
                                type: array
                                maxItems: 100
                                nullable: true
                              discountClass:
                                enum:
                                - ORDER
                                - PRODUCT
                                type: string
                              endsAt:
                                type: string
                                nullable: true
                              id:
                                type: string
                              products:
                                items:
                                  properties:
                                    id:
                                      type: string
                                    title:
                                      type: string
                                      nullable: true
                                  type: object
                                type: array
                                maxItems: 100
                                nullable: true
                              value:
                                type: number
                              valueType:
                                enum:
                                - PERCENTAGE
                                - DISCOUNT_AMOUNT
                                type: string
                            type: object
                            nullable: true
                          codelessDiscount:
                            properties:
                              appliesOnEachItem:
                                type: boolean
                                nullable: true
                              collections:
                                items:
                                  properties:
                                    id:
                                      type: string
                                    title:
                                      type: string
                                  type: object
                                type: array
                                maxItems: 100
                                nullable: true
                              discountClass:
                                enum:
                                - ORDER
                                - PRODUCT
                                type: string
                              endsAt:
                                type: string
                                nullable: true
                              id:
                                type: string
                              products:
                                items:
                                  properties:
                                    id:
                                      type: string
                                    title:
                                      type: string
                                      nullable: true
                                  type: object
                                type: array
                                maxItems: 100
                                nullable: true
                              value:
                                type: number
                              valueType:
                                enum:
                                - PERCENTAGE
                                - DISCOUNT_AMOUNT
                                type: string
                            type: object
                            nullable: true
                          currencyCode:
                            description: The currency code that the store is using.
                            example: USD
