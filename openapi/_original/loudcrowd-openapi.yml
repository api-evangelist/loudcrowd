    brandOrder:
      type: object
      description: An attributed order. If the order is cancelled before commission is paid, `amount`,
        `tax`, `shipping`, `refundAmount`, `refundTax`, and `commissionAmount` are all `"0.00"`. If the
        order is cancelled after commission is paid, those values remain as recorded when the commission
        was paid.
      required:
      - orderId
      - ambassadorLcId
      - attributionTypes
      - commissionAmount
      - amount
      - tax
      - shipping
      - refundAmount
      - refundTax
      - currency
      - cancelledAt
      - orderedAt
      - lastUpdatedAt
      properties:
        orderId:
          type: string
          description: Order identifier from the connected ecommerce platform.
        ambassadorLcId:
          type: string
          description: LoudCrowd ID for the selected program member.
        attributionTypes:
          type: array
          description: Distinct attribution methods recorded for the order. May contain more than one
            value.
          items:
            type: string
            enum:
            - LANDED
            - AFFILIATE_CODE
            - LINK_DISCOUNT
            - EXTERNAL
            - MANUAL
        commissionAmount:
          type: string
          nullable: true
          description: Commission currently recorded for the selected program member, as an exact decimal
            string in currency. It is null only when commission has not been calculated yet.
          example: '10.00'
        amount:
          type: string
          description: Order total before refunds, as an exact decimal string in currency. Includes tax
            and shipping.
          example: '100.00'
        tax:
          type: string
          description: Tax before refunds, as an exact decimal string in currency. Included in amount.
          example: '8.00'
        shipping:
          type: string
          description: Shipping as an exact decimal string in currency. Included in amount.
          example: '5.00'
        refundAmount:
          type: string
          description: Processed refund total as an exact decimal string in currency. Includes refundTax.
          example: '0.00'
        refundTax:
          type: string
          description: Tax included in refundAmount, as an exact decimal string in currency.
          example: '0.00'
        currency:
          type: string
          description: ISO 4217 currency code for every monetary field in this order.
          pattern: ^[A-Z]{3}$
          example: USD
        cancelledAt:
          type: string
          format: date-time
          nullable: true
          description: UTC cancellation timestamp from the ecommerce platform. It is null when unavailable.
        orderedAt:
          type: string
          format: date-time
          description: UTC timestamp when the order was placed on the ecommerce platform.
        lastUpdatedAt:
          type: string
          format: date-time
          nullable: true
          description: UTC timestamp of the latest ecommerce-platform update. It is null when unavailable.
    brandBadRequest:
      type: object
      required:
      - error
