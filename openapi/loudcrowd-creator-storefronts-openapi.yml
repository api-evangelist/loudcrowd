  /StorefrontProductDetails:
    get:
      summary: Retrieve Product Details
      description: Detailed data to support social-enhanced display of an ambassador's picked product.
      parameters:
      - in: query
        name: lcAmbassadorId
        description: The unique identifier of the ambassador generated by the LoudCrowd platform.
        required: true
        schema:
          type: string
          maxLength: 32
          pattern: ^[a-zA-Z0-9+/]*={0,2}$
      - in: query
        name: shopId
        description: The unique identifier of the shop that the ambassador is associated with. This field
          is not required if the `shopifyId` field is populated.
        required: false
        schema:
          type: string
      - in: query
        name: shopifyId
        description: The unique identifier of the shopify shop that the ambassador is associated with.
          This field is not required if the `shopId` field is populated.
        required: false
        schema:
          type: string
      - in: query
        name: productVariantId
        description: The unique identifier of the product variant item in the LoudCrowd platform.
        required: true
        schema:
          type: string
          maxLength: 32
          pattern: ^[a-zA-Z0-9+/]*={0,2}$
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  productDetails:
                    type: object
                    properties:
                      product:
                        type: object
                        properties:
                          id:
                            type: string
                            description: The unique identifier of the product in LoudCrowd.
                            example: XYZDJSK1ABC
                          active:
                            type: boolean
                            description: Whether the product is active.
                            example: true
                          brand:
                            type: string
                            nullable: true
                            description: The brand of the product.
                            example: Nike
                          handle:
                            type: string
                            nullable: true
                            description: The handle of the product.
                            example: nike-air-force-1
                          imageSrc:
                            type: string
                            nullable: true
                            description: The URL of the product image.
                            example: https://media.loudcrowd.com/17841409007688784.jpg
                          options:
                            description: The options available for the product.
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  description: The name of the option.
                                  type: string
                                values:
                                  description: The possible values of the option.
                                  type: array
                                  items:
                                    type: string
                          platformProductId:
                            type: string
                            description: The unique identifier of the product in the platform.
                            example: XYZDJSK1ABC
                          priceCurrencyCode:
                            $ref: '#/components/schemas/priceCurrencyCode'
                          prices:
                            $ref: '#/components/schemas/productPrices'
                          productUrl:
                            description: The URL of the product details.
                            type: string
                            nullable: true
                          title:
                            description: The title of the product.
                            type: string
                            nullable: true
                      productVariant:
                        type: object
                        properties:
                          id:
                            description: The unique identifier of the product variant in the LoudCrowd.
                            type: string
                            example: XYZDJSK1ABC
                          productUrl:
                            description: The URL of the variant the ambassador has picked.
                            type: string
                            nullable: true
                          selectedOptions:
                            description: The selected options of the product variant.
                            type: array
                            items:
                              $ref: '#/components/schemas/selectedOptionItem'
                      customMedia:
                        description: If the ambassador chose a custom media for the feed item when they
                          picked it, this object will be populated with that media.
                        type: object
                        properties:
                          id:
                            description: The unique identifier of the custom media in the LoudCrowd platform.
                            type: string
                            example: XYZ123ABC
                          imageSrc:
                            description: The URL of the custom media image.
                            type: string
                            nullable: true
                            example: https://media.loudcrowd.com/17841409007688784.jpg
                        nullable: true
                      taggedMedias:
                        type: array
                        items:
                          type: object
                          $ref: '#/components/schemas/mediaItem'
                        maxItems: 250
                        nullable: true
                      featuredAt:
                        description: If the product is featured, the date it was featured in Coordinated
                          Universal Time (UTC).
                        type: string
                        nullable: true
                        example: '2021-07-01T00:00:00Z'
                      pickedAt:
                        description: The date it was picked and added to the collection in Coordinated
                          Universal Time (UTC).
                        type: string
                        nullable: true
                        example: '2021-07-01T00:00:00Z'
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
servers:
- url: https://store-api.loudcrowd.com/api
  description: The base url for the LoudCrowd Creator Storefronts API.
  variables: {}
security:
- bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Authorization header using the Bearer scheme. Example: "Authorization: Bearer {token}"'
  responses:
    '400':
      description: Request is missing or has a bad parameter.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 400
              message:
                type: string
                example: Bad Request
    '401':
      description: Key is valid, but the account does not have permissions to perform this action.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 401
              message:
                type: string
                example: Not Authorized
    '403':
      description: Request is missing or has an invalid API key.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 403
              message:
                type: string
                example: Forbidden
    '404':
      description: The requested resource doesn't exist.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 404
              message:
                type: string
                example: Not Found
    '429':
      description: You hit the rate limit for this account. All endpoints share the same rate limit for
        an account.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 429
              message:
                type: string
                example: Rate Limit Exceeded
    '500':
      description: Something is wrong on LoudCrowd's end.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 500
              message:
                type: string
                example: Server Error
    '503':
      description: Service unavailable.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 503
              message:
                type: string
                example: Bad Gateway
