  /StorefrontCollections:
    get:
      summary: Retrieve Ambassador Collections
      description: Retrieve an array of collections that the Ambassador is associated with.
      parameters:
      - in: query
        name: lcAmbassadorId
        description: The unique identifier of the ambassador generated by the LoudCrowd platform.
        required: true
        schema:
          type: string
          maxLength: 32
          pattern: ^[a-zA-Z0-9+/]*={0,2}$
      - in: query
        name: sharedCollectionId
        description: If this parameter is provided, the response will sort the Collection list with this
          one first.
        required: false
        schema:
          type: string
          maxLength: 32
          pattern: ^[a-zA-Z0-9+/]*={0,2}$
      - in: query
        name: shopId
        description: The unique identifier of the shop that the ambassador is associated with. This field
          is not required if the `shopifyId` field is populated.
        required: false
        schema:
          type: string
          maxLength: 32
          pattern: ^[a-zA-Z0-9+/]*={0,2}$
      - in: query
        name: shopifyId
        description: The unique identifier of the shopify shop that the ambassador is associated with.
          This field is not required if the `shopId` field is populated.
        required: false
        schema:
          type: string
          maxLength: 32
          pattern: ^[a-zA-Z0-9+/]*={0,2}$
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  ecommAmbassador:
                    properties:
                      ambassadorCollections:
                        items:
                          properties:
                            description:
                              description: The description that the ambassador has chosen for the collection.
                              type: string
                              example: The best of the best items for your summer vacation!
                              nullable: true
                            featuredAt:
                              description: If the collection is featured, the date it was featured in
                                Coordinated Universal Time (UTC).
                              type: string
                              nullable: true
                              example: '2021-07-01T00:00:00Z'
                            id:
                              description: The unique identifier of the collection in the LoudCrowd platform.
                              type: string
                              example: JSKD23SFJ
                            name:
                              description: The name of the collection.
                              type: string
                              example: Summer Collection
                            productsCount:
                              description: The number of products in the collection.
                              type: integer
                              example: 5
                              nullable: true
                          type: object
                        type: array
                        maxItems: 200
                        nullable: true
                    type: object
                    nullable: true
                type: object
          description: response
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
  /StorefrontFeedItems:
    get:
      summary: Retrieve Collection Feed Items
      description: Retrieve a list of items found in a target Ambassador collection.
      parameters:
      - in: query
        name: storefrontCollectionId
        description: If this parameter is provided, the response will return the feed items for this collection.
          If omitted, the response will return the feed items for all collections combined.
        required: false
        schema:
          type: string
      - in: query
        name: lcAmbassadorId
        description: The unique identifier of the ambassador generated by the LoudCrowd platform.
        required: true
        schema:
          type: string
      - in: query
        name: mediaCursor
        description: The cursor to paginate the media items.
        required: false
        schema:
          type: string
      - in: query
        name: productCursor
        description: The cursor to paginate the product items.
        required: false
        schema:
          type: string
      - in: query
        name: sharedMediaId
        description: If this parameter is provided, the response will sort the Media list with this one
          first.
        required: false
        schema:
          type: string
      - in: query
        name: sharedProductId
        description: If this parameter is provided, the response will sort the Product list with this
          one first.
        required: false
        schema:
          type: string
      - in: query
        name: shopId
        description: The unique identifier of the shop that the ambassador is associated with. This field
          is not required if the `shopifyId` field is populated.
        required: false
        schema:
          type: string
      - in: query
        name: shopifyId
        description: The unique identifier of the shopify shop that the ambassador is associated with.
          This field is not required if the `shopId` field is populated.
        required: false
        schema:
          type: string
      - in: query
        name: mediaSort
        description: The field indicating how the media items are sorted.
        required: false
        schema:
          default:
          - FEATURED_AT
          - POSTED_AT
          items:
            enum:
            - UNTAGGED
            - VISIBLE
            - FEATURED_AT
            - POSTED_AT
            type: string
          type: array
          maxItems: 3
          nullable: true
      - in: query
        name: includeFeedItemTypes
        description: The types of feed items to include in the query.
        required: false
        schema:
          default:
          - PRODUCT
          - MEDIA
          items:
            enum:
            - PRODUCT
            - MEDIA
            type: string
          type: array
          maxItems: 2
          nullable: true
      - in: query
        name: includeHiddenMedia
        description: Return medias that were marked as hidden.
        required: false
        schema:
          type: boolean
          nullable: true
      - in: query
        name: includeTaggedMedia
        description: Return medias that were tagged with products by the ambassador.
        required: false
        schema:
          type: boolean
          nullable: true
      - in: query
        name: includeUntaggedMedia
        description: Return medias that were not tagged with products by the ambassador.
        required: false
        schema:
          type: boolean
          nullable: true
      - in: query
        name: mediaTypes
        description: The types of media items to include in the query.
        required: false
        schema:
          default:
          - IMAGE
          - VIDEO
          - CAROUSEL_ALBUM
          items:
            enum:
            - IMAGE
            - VIDEO
            - CAROUSEL_ALBUM
            type: string
          type: array
          maxItems: 3
          nullable: true
      - in: query
        name: minMediaPostedAt
        description: The minimum date that the media was posted.
        required: false
        schema:
          type: string
          nullable: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  ecommAmbassador:
                    properties:
                      id:
                        type: string
                      pagedAmbassadorFeedItems:
                        properties:
                          mediaCursor:
                            type: string
                            nullable: true
                          productCursor:
                            type: string
                            nullable: true
                          results:
                            items:
                              anyOf:
                              - properties:
                                  __typename:
                                    description: The type of the feed item. Either a product or media.
                                    type: string
                                    example: PRODUCT
                                  customMedia:
                                    description: If the ambassador chose a custom media for the feed item
                                      when they picked it, this object will be populated with that media.
                                    type: object
                                    properties:
                                      id:
                                        description: The unique identifier of the custom media in the
                                          LoudCrowd platform.
                                        type: string
                                        example: XYZ123ABC
                                      imageSrc:
                                        description: The URL of the custom media image.
                                        type: string
                                        example: https://media.loudcrowd.com/17841409007688784.jpg
                                        nullable: true
                                    nullable: true
                                  featuredAt:
                                    description: If the item is featured, the date it was featured in
                                      Coordinated Universal Time (UTC).
                                    type: string
                                    example: '2021-07-01T00:00:00Z'
                                    nullable: true
                                  isOnlyProductInCollection:
                                    description: If the product is the only product in the collection.
                                    type: boolean
                                    example: false
                                    nullable: true
                                  pickedAt:
                                    description: The date it was picked and added to the collection in
                                      Coordinated Universal Time (UTC).
                                    type: string
                                    example: '2021-07-01T00:00:00Z'
                                    nullable: true
                                  product:
                                    properties:
                                      active:
                                        type: boolean
                                        description: Whether the product is active.
                                        example: true
                                      brand:
                                        type: string
                                        description: The brand of the product.
                                        example: Nike
                                        nullable: true
                                      handle:
                                        type: string
                                        description: The handle of the product.
                                        example: nike-air-force-1
                                        nullable: true
                                      imageSrc:
                                        type: string
                                        description: The URL of the product image.
                                        example: https://media.loudcrowd.com/17841409007688784.jpg
                                        nullable: true
