openapi: 3.2.0
info:
  title: Loudcrowd Storefront Ambassador API
  version: 0.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: 'Operations tagged StorefrontAmbassador across 2 of this provider''s published API definitions: loudcrowd-creator-storefronts-openapi.yml, loudcrowd-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://store-api.loudcrowd.com/api
  description: The base url for the LoudCrowd Creator Storefronts API.
  variables: {}
- url: https://api.loudcrowd.com
  description: LoudCrowd Attribution Events API
security:
- bearerAuth: []
tags:
- name: StorefrontAmbassador
paths:
  /StorefrontAmbassador:
    get:
      summary: Retrieve Ambassador Information
      description: Returns information about the target ambassador identified by their unique LoudCrowd ID.
      parameters:
      - in: query
        name: lcAmbassadorId
        description: The unique identifier of the ambassador generated by the LoudCrowd platform.
        required: true
        schema:
          type: string
          maxLength: 32
          pattern: ^[a-zA-Z0-9+/]*={0,2}$
      - in: query
        name: shopId
        description: The unique identifier of the shop that the ambassador is associated with. This field is not required if the `shopifyId` field is populated.
        required: false
        schema:
          type: string
          maxLength: 32
          pattern: ^[a-zA-Z0-9+/]*={0,2}$
      - in: query
        name: shopifyId
        description: The unique identifier of the shopify shop that the ambassador is associated with. This field is not required if the `shopId` field is populated.
        required: false
        schema:
          type: string
          maxLength: 32
          pattern: ^[a-zA-Z0-9+/]*={0,2}$
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  ecommAmbassador:
                    properties:
                      affiliateCode:
                        description: This is the ambassador's affiliate code, if one has been assigned to them.
                        type:
                        - string
                        - 'null'
                        example: JOE123
                      ambassadorLink:
                        type:
                        - string
                        - 'null'
                        description: The sharable link to the ambassador's storefront.
                        example: https://store.com/creator_storefront?lc_ambassador_id=XYZ123ABC
                      firstName:
                        type:
                        - string
                        - 'null'
                        description: The first name of the ambassador.
                        example: Joe
                      id:
                        type: string
                        description: The unique identifier of the ambassador in the LoudCrowd platform.
                        example: XYZ123ABC
                      lastName:
                        type:
                        - string
                        - 'null'
                        description: The last name of the ambassador.
                        example: Smith
                      linkDiscountEnabled:
                        type:
                        - boolean
                        - 'null'
                        description: If `true` the ambassador's storefront has an automatic discount applied.
                        example: false
                      profile:
                        properties:
                          avatar:
                            type:
                            - string
                            - 'null'
                            description: The URL of the ambassador's avatar image.
                            example: https://media.loudcrowd.com/17841409007688784.jpg
                          bio:
                            type:
                            - string
                            - 'null'
                            description: The biography that the ambassador has chosen to display at the top of their storefront.
                            example: Welcome to my store! I hope you find something you love.
                        type:
                        - object
                        - 'null'
                      program:
                        properties:
                          codeDiscount:
                            properties:
                              appliesOnEachItem:
                                type:
                                - boolean
                                - 'null'
                              collections:
                                items:
                                  properties:
                                    id:
                                      type: string
                                    title:
                                      type: string
                                  type: object
                                type:
                                - array
                                - 'null'
                                maxItems: 100
                              discountClass:
                                enum:
                                - ORDER
                                - PRODUCT
                                type: string
                              endsAt:
                                type:
                                - string
                                - 'null'
                              id:
                                type: string
                              products:
                                items:
                                  properties:
                                    id:
                                      type: string
                                    title:
                                      type:
                                      - string
                                      - 'null'
                                  type: object
                                type:
                                - array
                                - 'null'
                                maxItems: 100
                              value:
                                type: number
                              valueType:
                                enum:
                                - PERCENTAGE
                                - DISCOUNT_AMOUNT
                                type: string
                            type:
                            - object
                            - 'null'
                          codelessDiscount:
                            properties:
                              appliesOnEachItem:
                                type:
                                - boolean
                                - 'null'
                              collections:
                                items:
                                  properties:
                                    id:
                                      type: string
                                    title:
                                      type: string
                                  type: object
                                type:
                                - array
                                - 'null'
                                maxItems: 100
                              discountClass:
                                enum:
                                - ORDER
                                - PRODUCT
                                type: string
                              endsAt:
                                type:
                                - string
                                - 'null'
                              id:
                                type: string
                              products:
                                items:
                                  properties:
                                    id:
                                      type: string
                                    title:
                                      type:
                                      - string
                                      - 'null'
                                  type: object
                                type:
                                - array
                                - 'null'
                                maxItems: 100
                              value:
                                type: number
                              valueType:
                                enum:
                                - PERCENTAGE
                                - DISCOUNT_AMOUNT
                                type: string
                            type:
                            - object
                            - 'null'
                          currencyCode:
                            description: The currency code that the store is using.
