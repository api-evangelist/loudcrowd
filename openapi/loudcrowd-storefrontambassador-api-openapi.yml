                            type:
                            - string
                            - 'null'
                          hideSalesPrice:
                            description: Whether to hide the sales price on the storefront.
                            example: false
                            type:
                            - boolean
                            - 'null'
                          name:
                            description: The name of the program that the ambassador joined.
                            example: Our Brand's Ambassadors
                            type: string
                          showOutOfStockProducts:
                            description: Whether to show out of stock products on the storefront.
                            example: false
                            type:
                            - boolean
                            - 'null'
                        type: object
                      socialUsers:
                        type:
                        - array
                        - 'null'
                        description: The social media accounts that the ambassador has connected to their storefront.
                        items:
                          properties:
                            platform:
                              type:
                              - string
                              - 'null'
                              description: The platform of the social media account.
                              example: INSTAGRAM
                            username:
                              type: string
                              description: The username of the social media account.
                              example: joesmith
                        maxItems: 100
                    type:
                    - object
                    - 'null'
          description: response
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
      tags:
      - StorefrontAmbassador
    servers:
    - url: https://store-api.loudcrowd.com/api
      description: The base url for the LoudCrowd Creator Storefronts API.
      variables: {}
components:
  responses:
    '400':
      description: Request is missing or has a bad parameter.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 400
              message:
                type: string
                example: Bad Request
    '404':
      description: The requested resource doesn't exist.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 404
              message:
                type: string
                example: Not Found
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Authorization header using the Bearer scheme. Example: "Authorization: Bearer {token}"'
    accountKeyAuth:
      type: apiKey
      in: header
      name: X-LC-Account-Key
      description: API token created in LoudCrowd.
      x-default: YOUR_API_TOKEN
