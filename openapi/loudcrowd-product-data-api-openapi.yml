      type:
      - string
      - 'null'
      description: The currency code of the product prices.
      example: USD
    selectedOptionItem:
      properties:
        name:
          description: The name of the selected option.
          type:
          - string
          - 'null'
          example: Color
        value:
          description: The value of the selected option.
          type:
          - string
          - 'null'
          example: Red
      type: object
    productIngestRecord:
      type: object
      description: Product payload aligned with file-based ingestion formats. Use nulls for clearing optional values.
      required:
      - platform_product_id
      - title
      properties:
        platform_product_id:
          type: string
          description: Unique product identifier from the eCommerce platform
        handle:
          type: string
          description: Product handle or slug
        title:
          type: string
          description: Product title
        brand:
          type:
          - string
          - 'null'
          description: Brand name
        image_src:
          type:
          - string
          - 'null'
          description: Primary product image URL
        product_url:
          type:
          - string
          - 'null'
          description: Product PDP URL
        active:
          type: boolean
          description: Whether product is active/available
        in_stock:
          type:
          - boolean
          - 'null'
          description: Inventory availability flag
        price_currency_code:
          $ref: '#/components/schemas/priceCurrencyCode'
        prices:
          $ref: '#/components/schemas/productPrices'
        promotional_code:
          type:
          - string
          - 'null'
          description: Applied sitewide promo code, if any
        collections:
          type:
          - array
          - 'null'
          description: Optional list of collection identifiers the product belongs to
          items:
            type: string
          maxItems: 250
        tags:
          type:
          - array
          - 'null'
          description: Optional list of product tags
          items:
            type: string
          maxItems: 250
        variants:
          type:
          - array
          - 'null'
          description: Optional list of product variants
          items:
            $ref: '#/components/schemas/productVariantIngestRecord'
          maxItems: 250
  responses:
    '429':
      description: You hit the rate limit for this account. All endpoints share the same rate limit for an account.
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Total requests allowed in the current window
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Requests remaining in the current window
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Unix epoch seconds when the current window resets
        Retry-After:
          schema:
            type: integer
          description: Seconds until the next request may be made
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 429
              message:
                type: string
                example: Rate Limit Exceeded
    '400':
      description: Request is missing or has a bad parameter.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 400
              message:
                type: string
                example: Bad Request
    '500':
      description: Something is wrong on LoudCrowd's end.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 500
              message:
                type: string
                example: Server Error
    '401':
      description: Key is valid, but the account does not have permissions to perform this action.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 401
              message:
                type: string
                example: Not Authorized
    '422':
      description: Validation failed for one or more product records.
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: integer
                example: 422
              message:
                type: string
                example: Unprocessable Entity
              recordErrors:
                type: array
                description: Per-record validation errors
                items:
                  type: object
                  properties:
                    index:
                      type: integer
                      description: Zero-based index of the product in the payload
                      example: 0
                    field:
                      type: string
                      description: JSON pointer or field path
                      example: products[0].platform_product_id
                    code:
                      type: string
                      description: Machine-readable error code
                      example: REQUIRED
                    message:
                      type: string
                      description: Human readable error
                      example: platform_product_id is required
                  required:
                  - index
                  - code
                  - message
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Authorization header using the Bearer scheme. Example: "Authorization: Bearer {token}"'
    accountKeyAuth:
      type: apiKey
      in: header
      name: X-LC-Account-Key
      description: API token created in LoudCrowd.
      x-default: YOUR_API_TOKEN
x-readme:
  explorer-enabled: false
