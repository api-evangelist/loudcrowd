openapi: 3.2.0
info:
  title: LoudCrowd Product Data API
  version: 0.0.0
  description: 'LoudCrowd public API definitions, including the account-scoped Brand API and Attribution Events API.

    '
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://store-api.loudcrowd.com/api
  description: LoudCrowd Creator Storefronts API
- url: https://api.loudcrowd.com
  description: LoudCrowd Attribution Events API
security:
- bearerAuth: []
tags:
- name: Product Data
paths:
  /product-data:
    post:
      summary: Send Product Data
      description: Batch upsert or delete product catalog records in LoudCrowd. Aligns with the supported file formats documented in the LoudCrowd developer docs. This API is designed to mirror the ingestion pipeline currently used for file-based product loads so that existing mappings can be reused.
      operationId: send_product_data
      parameters:
      - in: header
        name: X-LC-SHOP-ID
        description: Your LoudCrowd internal shop identifier
        required: true
        schema:
          type: string
      - in: header
        name: X-Signature
        description: The SHA-256 hexadecimal digest of the UTF-8 encoded JSON payload
        required: true
        schema:
          type: string
      - in: header
        name: X-LC-TOPIC
        description: Specifies the operation to apply to the provided products
        required: true
        schema:
          type: string
          enum:
          - PRODUCT_UPSERT
          - PRODUCT_DELETE
      - in: header
        name: Content-Type
        description: Content type of the request
        required: true
        schema:
          type: string
          default: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/sendProductDataRequest'
      responses:
        '200':
          description: Request accepted and processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Product data processed
                  processedCount:
                    type: integer
                    example: 123
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      tags:
      - Product Data
components:
  schemas:
    productPrices:
      properties:
        discountedPriceRanges:
          description: List of the discounted price ranges for the product.
          items:
            properties:
              discount:
                properties:
                  id:
                    type: string
                type: object
              range:
                properties:
                  max:
                    type: number
                  min:
                    type: number
                type: object
            type: object
          type: array
          maxItems: 10
        discountedPrices:
          description: List of the discounted prices for the product.
          items:
            properties:
              discount:
                properties:
                  id:
                    type: string
                type: object
              price:
                type: number
            type: object
          type: array
          maxItems: 10
        price:
          description: The price of the product.
          type:
          - number
          - 'null'
        priceRange:
          description: The price range of the product.
          properties:
            max:
              type: number
            min:
              type: number
          type:
          - object
          - 'null'
        promotionalPrice:
          description: If there is a site wide promotion applied to the product data, the promotional price of the product.
          type:
          - number
          - 'null'
        promotionalPriceRange:
          description: If there is a site wide promotion applied to the product data, the promotional price range of the product.
          properties:
            max:
              type: number
            min:
              type: number
          type:
          - object
          - 'null'
        salePrice:
          description: The sale price of the product.
          type:
          - number
          - 'null'
        salePriceRange:
          description: The sale price range of the product.
          properties:
            max:
              type: number
            min:
              type: number
          type:
          - object
          - 'null'
      type:
      - object
      - 'null'
    sendProductDataRequest:
      type: object
      required:
      - products
      properties:
        products:
          type: array
          description: Batch of product records to upsert or delete.
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/productIngestRecord'
    productVariantIngestRecord:
      type: object
      required:
      - variant_sku
      properties:
        variant_sku:
          type: string
          description: Variant SKU (acts as external key)
        price:
          type:
          - number
          - 'null'
          description: Variant price
        sale_price:
          type:
          - number
          - 'null'
          description: Variant sale price
        product_url:
          type:
          - string
          - 'null'
          description: Variant PDP URL
        selected_options:
          type:
          - array
          - 'null'
          description: Key/value option selections like Size/Color
          items:
            $ref: '#/components/schemas/selectedOptionItem'
          maxItems: 100
